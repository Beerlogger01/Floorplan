<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 1200"
  width="600"
  height="1200"
  id="floorplan"
  role="img"
  aria-label="Apartment floorplan with smart home devices"
>
  <!-- Stylesheet reference -->
  <defs>
    <style>
      /* Inline styles are intentionally minimal. See apartment_floorplan.css */
      /* Dynamic classes and animations are managed by CSS file */
    </style>
  </defs>

  <!-- Dark background for smart home aesthetic -->
  <rect id="background" x="0" y="0" width="600" height="1200" fill="#0f1419" />

  <!-- Entry / Corridor Zone (center vertical, bottom) -->
  <g id="room-corridor">
    <!-- Main corridor floor -->
    <rect id="corridor-floor" x="150" y="950" width="300" height="200" rx="16" ry="16" />
    <!-- Entrance marker -->
    <circle id="entrance-marker" cx="300" cy="1050" r="30" fill="none" stroke-width="2" />
    <text id="corridor-label" x="300" y="980" text-anchor="middle" font-size="14" font-weight="500">Entry</text>
  </g>

  <!-- Kitchen (top-left) -->
  <g id="room-kitchen">
    <rect id="kitchen-floor" x="30" y="30" width="240" height="280" rx="16" ry="16" />
    <!-- Light overlay for dynamic glow (hidden by default, shown when light is on) -->
    <rect id="room_kitchen_light" x="30" y="30" width="240" height="280" rx="16" ry="16" opacity="0" class="room-light-overlay" />
    <text id="kitchen-label" x="150" y="180" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600">Kitchen</text>
  </g>

  <!-- Bathroom (bottom-left) -->
  <g id="room-bathroom">
    <rect id="bathroom-floor" x="30" y="360" width="240" height="300" rx="16" ry="16" />
    <!-- Static room, no dynamic lighting -->
    <text id="bathroom-label" x="150" y="510" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600">Bathroom</text>
  </g>

  <!-- Bedroom (top-right) -->
  <g id="room-bedroom">
    <rect id="bedroom-floor" x="330" y="30" width="240" height="280" rx="16" ry="16" />
    <!-- Light overlay for dynamic glow -->
    <rect id="room_bedroom_light" x="330" y="30" width="240" height="280" rx="16" ry="16" opacity="0" class="room-light-overlay" />
    <text id="bedroom-label" x="450" y="180" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600">Bedroom</text>
  </g>

  <!-- Living Room (bottom-right) -->
  <g id="room-living-room">
    <rect id="living-room-floor" x="330" y="360" width="240" height="300" rx="16" ry="16" />
    <!-- Light overlay for dynamic glow (conditional, pending real light entity) -->
    <rect id="room_living_light" x="330" y="360" width="240" height="300" rx="16" ry="16" opacity="0" class="room-light-overlay" />
    <text id="living-room-label" x="450" y="510" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600">Living Room</text>
  </g>

  <!-- Corridor light overlay (center zone) -->
  <g id="corridor-lights">
    <rect id="room_corridor_light" x="150" y="950" width="300" height="200" rx="16" ry="16" opacity="0" class="room-light-overlay" />
  </g>

  <!-- Roborock status zone (placeholder for future live position) -->
  <g id="roborock-zone">
    <!-- Roborock position indicator (will be updated via Home Assistant) -->
    <circle id="robot-position" cx="150" cy="1000" r="20" opacity="0" class="robot-indicator" />
    <text id="robot-status" x="300" y="1100" text-anchor="middle" font-size="12" fill="#888888">Robot: docked</text>
  </g>

  <!-- Legend / Info (optional, can be hidden) -->
  <g id="legend" opacity="0.6">
    <text x="20" y="1180" font-size="10" fill="#999999">Tap rooms to toggle lights • Tap icons for more info</text>
  </g>

</svg>
