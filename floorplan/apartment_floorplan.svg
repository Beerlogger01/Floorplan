<svg
  id="floorplan_gabelsbergerstr"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 1100"
  width="720"
  height="1100"
  role="img"
  aria-label="Smart home floorplan: kitchen, bedroom, bathroom, living room, corridor"
>
  <!-- ============================================================
       DEFINITIONS: Filters, gradients, reusable symbols
       ============================================================ -->
  <defs>
    <style>
      /* Inline minimal - see apartment_floorplan.css for all styling */
    </style>

    <!-- Soft shadow filter for rooms -->
    <filter id="room_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow filter for light overlays -->
    <filter id="glow_filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================================
       BACKGROUND LAYER
       ============================================================ -->
  <g id="background_layer">
    <rect
      id="bg_main"
      x="0"
      y="0"
      width="720"
      height="1100"
      fill="#0f1419"
      class="bg-main"
    />
  </g>

  <!-- ============================================================
       APARTMENT SHELL LAYER (TODO: Add walls if needed)
       ============================================================ -->
  <g id="apartment_shell_layer">
    <!-- Outer boundary (for future blueprints) -->
  </g>

  <!-- ============================================================
       ROOMS BASE LAYER
       Static room shapes, always visible
       ============================================================ -->
  <g id="rooms_base_layer" class="rooms">

    <!-- KITCHEN (top-left) -->
    <path
      id="room_kitchen"
      class="room room-kitchen"
      d="M 20 20 L 340 20 L 340 300 L 20 300 Z"
      rx="16" ry="16"
      filter="url(#room_shadow)"
    />

    <!-- BATHROOM (bottom-left) -->
    <path
      id="room_bathroom"
      class="room room-bathroom"
      d="M 20 350 L 340 350 L 340 620 L 20 620 Z"
      rx="16" ry="16"
      filter="url(#room_shadow)"
    />

    <!-- CORRIDOR / ENTRY (center, vertical) -->
    <path
      id="room_corridor_entry"
      class="room room-corridor"
      d="M 380 650 L 600 650 L 600 1050 L 380 1050 Z"
      rx="16" ry="16"
      filter="url(#room_shadow)"
    />

    <!-- BEDROOM (top-right) -->
    <path
      id="room_bedroom"
      class="room room-bedroom"
      d="M 380 20 L 700 20 L 700 300 L 380 300 Z"
      rx="16" ry="16"
      filter="url(#room_shadow)"
    />

    <!-- LIVING ROOM (bottom-right) -->
    <path
      id="room_living"
      class="room room-living"
      d="M 380 350 L 700 350 L 700 620 L 380 620 Z"
      rx="16" ry="16"
      filter="url(#room_shadow)"
    />

  </g>

  <!-- ============================================================
       ROOMS LIGHT OVERLAY LAYER
       Dynamic light overlays (separate from base rooms)
       ============================================================ -->
  <g id="rooms_light_overlay_layer" class="light-overlays">

    <!-- KITCHEN light overlay -->
    <path
      id="room_kitchen_light"
      class="room-light-overlay room-kitchen-light"
      d="M 20 20 L 340 20 L 340 300 L 20 300 Z"
      rx="16" ry="16"
      fill="#ffd700"
      opacity="0"
      filter="url(#glow_filter)"
    />

    <!-- BEDROOM light overlay -->
    <path
      id="room_bedroom_light"
      class="room-light-overlay room-bedroom-light"
      d="M 380 20 L 700 20 L 700 300 L 380 300 Z"
      rx="16" ry="16"
      fill="#ffd700"
      opacity="0"
      filter="url(#glow_filter)"
    />

    <!-- CORRIDOR light overlay -->
    <path
      id="room_corridor_light"
      class="room-light-overlay room-corridor-light"
      d="M 380 650 L 600 650 L 600 1050 L 380 1050 Z"
      rx="16" ry="16"
      fill="#ffd700"
      opacity="0"
      filter="url(#glow_filter)"
    />

    <!-- LIVING ROOM light overlay (static, no confirmed light entity) -->
    <path
      id="room_living_light"
      class="room-light-overlay room-living-light"
      d="M 380 350 L 700 350 L 700 620 L 380 620 Z"
      rx="16" ry="16"
      fill="#ffd700"
      opacity="0"
      filter="url(#glow_filter)"
    />

  </g>

  <!-- ============================================================
       WALLS LAYER (TODO: Add internal walls if needed)
       ============================================================ -->
  <g id="walls_layer" class="structural">
  </g>

  <!-- ============================================================
       DOORS LAYER (TODO: Add door markers if needed)
       ============================================================ -->
  <g id="doors_layer" class="doors">
  </g>

  <!-- ============================================================
       WINDOWS LAYER (TODO: Add window markers if needed)
       ============================================================ -->
  <g id="windows_layer" class="windows">
  </g>

  <!-- ============================================================
       LABELS LAYER
       Room labels only (readable, always visible)
       ============================================================ -->
  <g id="labels_layer" class="labels">

    <!-- Kitchen label -->
    <text
      id="label_kitchen_name"
      x="180"
      y="160"
      text-anchor="middle"
      dominant-baseline="middle"
      class="label-room"
    >
      Kitchen
    </text>

    <!-- Bathroom label -->
    <text
      id="label_bathroom_name"
      x="180"
      y="485"
      text-anchor="middle"
      dominant-baseline="middle"
      class="label-room"
    >
      Bathroom
    </text>

    <!-- Corridor label -->
    <text
      id="label_corridor_name"
      x="490"
      y="850"
      text-anchor="middle"
      dominant-baseline="middle"
      class="label-room"
    >
      Entry / Corridor
    </text>

    <!-- Bedroom label -->
    <text
      id="label_bedroom_name"
      x="540"
      y="160"
      text-anchor="middle"
      dominant-baseline="middle"
      class="label-room"
    >
      Bedroom
    </text>

    <!-- Living Room label -->
    <text
      id="label_living_name"
      x="540"
      y="485"
      text-anchor="middle"
      dominant-baseline="middle"
      class="label-room"
    >
      Living Room
    </text>

  </g>

  <!-- ============================================================
       ENTITIES LAYER
       Clickable entity icons (lights, switches, devices)
       ============================================================ -->
  <g id="entities_layer" class="entities">

    <!-- =============== KITCHEN ENTITIES =============== -->

    <!-- Kitchen light (main) -->
    <circle
      id="icon_kitchen_light"
      class="entity entity-light"
      cx="280"
      cy="80"
      r="20"
    />
    <text x="280" y="80" text-anchor="middle" dominant-baseline="middle" class="icon-label">💡</text>

    <!-- Kitchen W601 switch -->
    <circle
      id="icon_kitchen_w601"
      class="entity entity-switch"
      cx="280"
      cy="140"
      r="20"
    />
    <text x="280" y="140" text-anchor="middle" dominant-baseline="middle" class="icon-label">🔲</text>

    <!-- Kitchen teapot switch + temp label -->
    <circle
      id="icon_kitchen_teapot"
      class="entity entity-switch"
      cx="280"
      cy="200"
      r="20"
    />
    <text x="280" y="200" text-anchor="middle" dominant-baseline="middle" class="icon-label">🫖</text>

    <text
      id="label_kitchen_teapot_temperature"
      class="entity entity-sensor"
      x="280"
      y="260"
      text-anchor="middle"
      font-size="12"
    >
      Teapot: --°C
    </text>

    <!-- =============== BEDROOM ENTITIES =============== -->

    <!-- Bedroom light (main) -->
    <circle
      id="icon_bedroom_light"
      class="entity entity-light"
      cx="620"
      cy="80"
      r="20"
    />
    <text x="620" y="80" text-anchor="middle" dominant-baseline="middle" class="icon-label">💡</text>

    <!-- Bedroom small lamp -->
    <circle
      id="icon_bedroom_small_lamp"
      class="entity entity-switch"
      cx="620"
      cy="140"
      r="20"
    />
    <text x="620" y="140" text-anchor="middle" dominant-baseline="middle" class="icon-label">🔆</text>

    <!-- Bedroom temperature + humidity -->
    <text
      id="label_bedroom_temperature"
      class="entity entity-sensor"
      x="620"
      y="200"
      text-anchor="middle"
      font-size="12"
    >
      Temp: --°C
    </text>

    <text
      id="label_bedroom_humidity"
      class="entity entity-sensor"
      x="620"
      y="230"
      text-anchor="middle"
      font-size="12"
    >
      RH: --%
    </text>

    <!-- Bedroom scene knob -->
    <circle
      id="icon_bedroom_knob"
      class="entity entity-button"
      cx="620"
      cy="280"
      r="16"
    />
    <text x="620" y="280" text-anchor="middle" dominant-baseline="middle" class="icon-label" font-size="14">🎚️</text>

    <!-- =============== CORRIDOR / ENTRY ENTITIES =============== -->

    <!-- Corridor light -->
    <circle
      id="icon_corridor_light"
      class="entity entity-light"
      cx="450"
      cy="700"
      r="20"
    />
    <text x="450" y="700" text-anchor="middle" dominant-baseline="middle" class="icon-label">💡</text>

    <!-- Motion sensor -->
    <circle
      id="icon_corridor_motion"
      class="entity entity-binary-sensor"
      cx="450"
      cy="760"
      r="20"
    />
    <text x="450" y="760" text-anchor="middle" dominant-baseline="middle" class="icon-label">🔍</text>

    <!-- Luminance sensor -->
    <text
      id="label_corridor_luminance"
      class="entity entity-sensor"
      x="450"
      y="820"
      text-anchor="middle"
      font-size="12"
    >
      Light: --- lux
    </text>

    <!-- Smart doorbell camera -->
    <circle
      id="icon_corridor_doorbell"
      class="entity entity-camera"
      cx="530"
      cy="1000"
      r="20"
    />
    <text x="530" y="1000" text-anchor="middle" dominant-baseline="middle" class="icon-label">📷</text>

    <!-- =============== LIVING ROOM ENTITIES =============== -->

    <!-- Living room TV / media -->
    <circle
      id="icon_living_tv"
      class="entity entity-media"
      cx="620"
      cy="420"
      r="20"
    />
    <text x="620" y="420" text-anchor="middle" dominant-baseline="middle" class="icon-label">📺</text>

    <!-- Living room audio outlet (not confirmed as main light) -->
    <circle
      id="icon_living_audio_outlet"
      class="entity entity-switch"
      cx="620"
      cy="510"
      r="20"
    />
    <text x="620" y="510" text-anchor="middle" dominant-baseline="middle" class="icon-label">🔊</text>

    <!-- =============== ROBOROCK VACUUM =============== -->

    <!-- Roborock icon + status -->
    <circle
      id="icon_roborock"
      class="entity entity-vacuum"
      cx="490"
      cy="550"
      r="24"
    />
    <text x="490" y="550" text-anchor="middle" dominant-baseline="middle" class="icon-label" font-size="18">🤖</text>

    <text
      id="label_roborock_status"
      class="entity entity-sensor"
      x="490"
      y="600"
      text-anchor="middle"
      font-size="12"
    >
      Status: docked
    </text>

  </g>

  <!-- ============================================================
       SENSORS LAYER (Future: sensor value labels)
       ============================================================ -->
  <g id="sensors_layer" class="sensors">
    <!-- Sensor value displays can go here if needed -->
  </g>

  <!-- ============================================================
       ROBOROCK LAYER
       Vacuum status / position (separate layer for potential animation)
       ============================================================ -->
  <g id="roborock_layer" class="roborock">
    <!-- Robot position indicator (will be updated by ha-floorplan) -->
  </g>

  <!-- ============================================================
       LEGEND / INFO (Optional)
       ============================================================ -->
  <g id="info_layer" opacity="0.5">
    <text x="20" y="1080" font-size="10" fill="#888888" class="label-info">
      Tap rooms for lights • Tap icons for more info
    </text>
  </g>

</svg>
