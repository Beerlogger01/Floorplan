<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  width="800"
  height="600"
  id="floorplan"
>
  <!-- Stylesheet -->
  <defs>
    <style>
      /* Inline styles are intentionally minimal. See apartment_floorplan.css */
    </style>
  </defs>

  <!-- Background -->
  <rect id="background" x="0" y="0" width="800" height="600" fill="#f5f5f0" />

  <!-- Kitchen (top-left) -->
  <g id="room-kitchen">
    <rect id="kitchen-floor" x="20" y="20" width="360" height="260" rx="12" ry="12" />
    <text id="kitchen-label" x="200" y="155" text-anchor="middle" dominant-baseline="middle">Kitchen</text>
  </g>

  <!-- Bathroom (bottom-left) -->
  <g id="room-bathroom">
    <rect id="bathroom-floor" x="20" y="320" width="360" height="260" rx="12" ry="12" />
    <text id="bathroom-label" x="200" y="455" text-anchor="middle" dominant-baseline="middle">Bathroom</text>
  </g>

  <!-- Bedroom (top-right) -->
  <g id="room-bedroom">
    <rect id="bedroom-floor" x="420" y="20" width="360" height="260" rx="12" ry="12" />
    <text id="bedroom-label" x="600" y="155" text-anchor="middle" dominant-baseline="middle">Bedroom</text>
  </g>

  <!-- Living Room (bottom-right) -->
  <g id="room-living-room">
    <rect id="living-room-floor" x="420" y="320" width="360" height="260" rx="12" ry="12" />
    <text id="living-room-label" x="600" y="455" text-anchor="middle" dominant-baseline="middle">Living Room</text>
  </g>

</svg>
